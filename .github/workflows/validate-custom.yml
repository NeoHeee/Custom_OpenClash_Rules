name: Validate Personal OpenClash YAML

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Aethersailor Upstream
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: validate-personal-openclash
  cancel-in-progress: false

jobs:
  validate:
    # Do not validate a stale branch after an unsuccessful upstream sync.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout personal custom branch
        uses: actions/checkout@v5
        with:
          ref: custom
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install -r my-config/requirements.txt

      - name: Generate updated Neo INI candidate (no promotion)
        run: python my-config/scripts/generate_neo_ini.py

      - name: Check candidate against active Neo INI
        id: neo-drift
        continue-on-error: true
        run: python my-config/scripts/generate_neo_ini.py --check

      - name: Archive review-only Neo candidate
        uses: actions/upload-artifact@v4
        with:
          name: neo-ini-candidate
          path: my-config/build/Neo_Clash_Full_Fallback.candidate.ini
          if-no-files-found: error
          retention-days: 14

      - name: Report candidate drift
        if: steps.neo-drift.outcome == 'failure'
        run: |
          echo '### Attention: Neo INI candidate differs from active template' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review neo-ini-candidate artifact and do not promote without testing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated candidate INI before publication
        run: python my-config/scripts/validate_ini.py --candidate

      - name: Check upstream and personal rule compatibility
        run: python my-config/scripts/build.py --check

      - name: Generate isolated test configuration
        run: python my-config/scripts/build.py

      - name: Verify base settings preserved
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          base = yaml.safe_load(Path("cfg/yaml/Custom_Clash_Full_Fallback.yaml").read_text(encoding="utf-8"))
          generated = yaml.safe_load(Path("my-config/build/Custom_Clash_Full_Fallback_Neo.yaml").read_text(encoding="utf-8"))

          for key in ("proxy-groups", "proxy-providers", "rule-providers", "dns", "ipv6", "tun"):
              if base.get(key) != generated.get(key):
                  raise SystemExit(f"Configuration changed unexpectedly: {key}")

          upstream_rules = base["rules"]
          personal_rules = generated["rules"]
          assert personal_rules[:2] == upstream_rules[:2], "Private/LAN precedence changed"
          assert personal_rules[-(len(upstream_rules) - 2):] == upstream_rules[2:], "Upstream rule ordering changed"

          if generated.get("proxy-providers", {}).get("provider1", {}).get("url") == "url":
              print("Expected: provider1 URL is a placeholder; YAML is NOT ready for deployment.")

          print("PASS: generated YAML parsed; upstream proxy groups, providers, DNS/IPv6/TUN and rule order preserved.")
          PY

      - name: Publish validated personal INI to custom branch
        id: publish
        run: |
          set -eu
          target="cfg/Neo_Clash_Full_Fallback.ini"
          candidate="my-config/build/Neo_Clash_Full_Fallback.candidate.ini"
          if cmp -s "$candidate" "$target"; then
            echo "No changes to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$candidate" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          git diff --cached --check
          git commit -m "chore(neo): publish validated synced template"
          git push origin HEAD:custom
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publication summary
        if: success()
        run: |
          if [ "${{ steps.publish.outputs.changed }}" = "true" ]; then
            echo '### Updated Neo template automatically after all checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Neo template already matches upstream-derived candidate.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Production subscription URL is unchanged; OpenClash refresh frequency controls when it fetches the new template.' >> "$GITHUB_STEP_SUMMARY"

      - name: Test summary
        if: success()
        run: |
          echo '### Personal OpenClash build validation passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a dry-run with placeholder provider URL. No router configuration was changed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No generated YAML was committed or published.' >> "$GITHUB_STEP_SUMMARY"
