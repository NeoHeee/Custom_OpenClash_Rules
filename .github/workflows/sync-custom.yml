name: Sync Aethersailor Upstream

on:
  schedule:
    # Beijing 08:20 (UTC 00:20); GitHub may delay scheduled runs
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neo-openclash-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controller
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream and branches
        run: |
          git remote add upstream https://github.com/Aethersailor/Custom_OpenClash_Rules.git
          git fetch upstream main
          git fetch origin upstream-sync custom

      - name: Update upstream content without GitHub workflows
        run: |
          # A regular GITHUB_TOKEN cannot push upstream changes to
          # .github/workflows/ without workflow-specific permission.
          # Maintain a synthetic tracking branch containing upstream
          # files outside that directory. Never force-push the branch.
          git switch -C upstream-sync origin/upstream-sync
          git restore --source=upstream/main --staged --worktree -- . ':(exclude).github/workflows/**'

          if [ -n "$(git diff --cached --name-only -- .github/workflows)" ]; then
            echo "::error::Refusing to modify GitHub Actions workflow files"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Non-workflow upstream content already current"
          else
            upstream_sha="$(git rev-parse --short=12 upstream/main)"
            git diff --cached --check
            git commit -m "chore(sync): import upstream content $upstream_sha (excluding workflows)"
            git push origin HEAD:upstream-sync
          fi

      - name: Merge updated tracking content into custom
        run: |
          git switch -C custom origin/custom
          git merge --no-edit upstream-sync
          git diff --check
          git push origin HEAD:custom

      - name: Summary
        if: success()
        run: |
          echo 'Upstream non-workflow files synchronized and merged into custom.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upstream .github/workflows/ files are intentionally excluded.' >> "$GITHUB_STEP_SUMMARY"
