name: Sync Aethersailor Upstream

on:
  schedule:
    # 08:20 Asia/Shanghai (00:20 UTC)
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neo-openclash-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controller
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream and branches
        run: |
          git remote add upstream https://github.com/Aethersailor/Custom_OpenClash_Rules.git
          git fetch upstream main
          git fetch origin upstream-sync custom

      - name: Update dedicated upstream tracking branch
        run: |
          old_sha="$(git rev-parse refs/remotes/origin/upstream-sync)"
          new_sha="$(git rev-parse refs/remotes/upstream/main)"

          if [ "$old_sha" = "$new_sha" ]; then
            echo "Tracking branch already current"
          elif git merge-base --is-ancestor "$old_sha" "$new_sha"; then
            echo "Fast-forwarding upstream-sync"
            git push origin "$new_sha:refs/heads/upstream-sync"
          else
            echo "::warning::Upstream history diverged. Repointing only the dedicated upstream-sync mirror, using a SHA lease."
            git push --force-with-lease="refs/heads/upstream-sync:$old_sha"               origin "$new_sha:refs/heads/upstream-sync"
          fi

      - name: Merge upstream into personal custom branch
        run: |
          git switch -C custom origin/custom
          git merge --no-edit upstream/main
          git diff --check
          git push origin HEAD:custom

      - name: Summary
        if: success()
        run: |
          echo 'Upstream sync and custom merge succeeded.' >> "$GITHUB_STEP_SUMMARY"
